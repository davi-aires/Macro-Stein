name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q scripts
      - run: python scripts/build.py --help
      - run: python scripts/test_launch.py --help
      # Full Java/GUI tests require the user's original mod and local Stein install.
